</a> </div> </header> <!-- Featured Image --> <div style="margin-bottom: 50px;" data-astro-cid-ovxcmftc> <img src="/images/projects/PyramidGame-Main.png" alt="From K-Drama to Code: My Journey Building The Pyramid Game" style="width: 100%; height: auto; border-radius: var(--border-radius);" data-astro-cid-ovxcmftc> </div> <!-- Content --> <div class="project-content" style="max-width: 800px;" data-astro-cid-ovxcmftc> <p>You know how sometimes you’re just chilling, watching K-dramas, and suddenly your developer brain goes “Hey, I could build that!”? Well, that’s exactly what happened to me while watching “Pyramid Game.” One minute I’m stress-eating snacks watching students navigate a complex social hierarchy, and the next thing I know, I’m opening VS Code at 2 AM. Classic developer moment, right?</p>
<h2 id="the-aha-moment"><em>The “Aha!” Moment</em></h2>
<p>Let me paint you a picture: There’s this K-drama where students participate in this wild voting system that determines their social ranking. Think of it as a digital popularity contest, but with actual consequences. The rules caught my attention - each student gets to vote for others, can’t vote for themselves (sorry, narcissists!), and ends up with a rank from A to F based on the votes they receive.</p>
<p><img src="/images/projects/PyramidGame-HomePage.png" alt="Pyramid Game Home Page"></p>
<h2 id="the-tech-stack-because-every-project-needs-a-solid-foundation">The Tech Stack: Because Every Project Needs a Solid Foundation</h2>
<p>After the initial excitement wore off (and the caffeine kicked in), I had to make some serious technical decisions. Here’s what I went with:</p>
<p><img src="/images/projects/PyramidGame-TechStack.png" alt="Tech Stack"></p>
<h2 id="the-fun-parts-read-challenges">The “Fun” Parts (Read: Challenges)</h2>
<h3 id="the-ranking-algorithm-math-is-hard">The Ranking Algorithm: Math Is Hard</h3>
<p>Remember in school when you thought “When will I ever use math in real life?” Well, past me, HERE’S YOUR ANSWER! Let me take you through this rollercoaster ride.</p>
<p><img src="/images/projects/PyramidGame-WaitingPage.png" alt="Game Waiting Page"></p>
<p>My first attempt was beautifully naive. I thought I could just count votes and assign ranks based on simple thresholds:</p>
<pre class="language-javascript" data-language="javascript"><code is:raw="" class="language-javascript"><span class="token comment">// My first innocent attempt at ranking</span>
<span class="token keyword">const</span> <span class="token function-variable function">calculateRank</span> <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token parameter">votes<span class="token punctuation">,</span> totalVotes</span><span class="token punctuation">)</span> <span class="token operator">=></span> <span class="token punctuation">{</span>
  <span class="token keyword">const</span> percentage <span class="token operator">=</span> <span class="token punctuation">(</span>votes <span class="token operator">/</span> totalVotes<span class="token punctuation">)</span> <span class="token operator">*</span> <span class="token number">100</span><span class="token punctuation">;</span>
  <span class="token keyword">if</span> <span class="token punctuation">(</span>percentage <span class="token operator">></span> <span class="token number">75</span><span class="token punctuation">)</span> <span class="token keyword">return</span> <span class="token string">'A'</span><span class="token punctuation">;</span>
  <span class="token keyword">if</span> <span class="token punctuation">(</span>percentage <span class="token operator">></span> <span class="token number">50</span><span class="token punctuation">)</span> <span class="token keyword">return</span> <span class="token string">'B'</span><span class="token punctuation">;</span>
  <span class="token keyword">if</span> <span class="token punctuation">(</span>percentage <span class="token operator">></span> <span class="token number">25</span><span class="token punctuation">)</span> <span class="token keyword">return</span> <span class="token string">'C'</span><span class="token punctuation">;</span>
  <span class="token keyword">if</span> <span class="token punctuation">(</span>votes <span class="token operator">></span> <span class="token number">0</span><span class="token punctuation">)</span> <span class="token keyword">return</span> <span class="token string">'D'</span><span class="token punctuation">;</span>
  <span class="token keyword">return</span> <span class="token string">'F'</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span><span class="token punctuation">;</span>
</code></pre>
<p>Looks clean, right? Well, the reality hit when we had a game with 5 participants and 1 vote by each. Suddenly, we had a situation where nobody got rank B or C, creating this weird gap in our pyramid. It looked something like this:</p>
<p><img src="/images/projects/PyramidGame-TestResult.png" alt="Test Game Result"></p>
<p>The pyramid wasn’t really a pyramid anymore - it was more like a seesaw! I went to search for some logic again in the ranking system and I found a result of one vote in 1 episode of the Pyramid Game. It was like this:</p>
<p><img src="/images/projects/PyramidGame-ResultPage.png" alt="Results page in the K-Drama"></p>
<p>Finally, after some serious head-scratching, I landed on the current algorithm. It’s a two-phase approach that first assigns ranks based on vote percentages and then promotes ranks to fill gaps:</p>
<pre class="language-javascript" data-language="javascript"><code is:raw="" class="language-javascript"><span class="token comment">// First pass: Assign initial ranks</span>
    <span class="token keyword">const</span> <span class="token literal-property property">initialRanks</span><span class="token operator">:</span> <span class="token punctuation">{</span> <span class="token literal-property property">participantId</span><span class="token operator">:</span> string<span class="token punctuation">;</span> rank<span class="token operator">:</span> Rank <span class="token punctuation">}</span><span class="token punctuation">[</span><span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">;</span>

    <span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token keyword">const</span> participant <span class="token keyword">of</span> participants<span class="token punctuation">)</span> <span class="token punctuation">{</span>
      <span class="token keyword">let</span> <span class="token literal-property property">rank</span><span class="token operator">:</span> Rank <span class="token operator">=</span> <span class="token string">"F"</span><span class="token punctuation">;</span>
      <span class="token keyword">if</span> <span class="token punctuation">(</span>participant<span class="token punctuation">.</span>voteCount <span class="token operator">></span> <span class="token number">0</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">const</span> votePercentage <span class="token operator">=</span> <span class="token punctuation">(</span>participant<span class="token punctuation">.</span>voteCount <span class="token operator">/</span> maxVotes<span class="token punctuation">)</span> <span class="token operator">*</span> <span class="token number">100</span><span class="token punctuation">;</span>
        <span class="token keyword">if</span> <span class="token punctuation">(</span>votePercentage <span class="token operator">>=</span> <span class="token number">67</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
          rank <span class="token operator">=</span> <span class="token string">"A"</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token keyword">if</span> <span class="token punctuation">(</span>votePercentage <span class="token operator">>=</span> <span class="token number">33</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
          rank <span class="token operator">=</span> <span class="token string">"B"</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token keyword">if</span> <span class="token punctuation">(</span>votePercentage <span class="token operator">>=</span> <span class="token number">24</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
          rank <span class="token operator">=</span> <span class="token string">"C"</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token keyword">if</span> <span class="token punctuation">(</span>votePercentage <span class="token operator">></span> <span class="token number">0</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
          rank <span class="token operator">=</span> <span class="token string">"D"</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
      <span class="token punctuation">}</span>
      initialRanks<span class="token punctuation">.</span><span class="token function">push</span><span class="token punctuation">(</span><span class="token punctuation">{</span> <span class="token literal-property property">participantId</span><span class="token operator">:</span> participant<span class="token punctuation">.</span>id<span class="token punctuation">,</span> rank <span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">// Second pass: Promote ranks if there are gaps</span>
    <span class="token keyword">const</span> <span class="token literal-property property">rankOrder</span><span class="token operator">:</span> Rank<span class="token punctuation">[</span><span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token punctuation">[</span><span class="token string">"A"</span><span class="token punctuation">,</span> <span class="token string">"B"</span><span class="token punctuation">,</span> <span class="token string">"C"</span><span class="token punctuation">,</span> <span class="token string">"D"</span><span class="token punctuation">,</span> <span class="token string">"F"</span><span class="token punctuation">]</span><span class="token punctuation">;</span>
    <span class="token keyword">const</span> ranksPresent <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Set</span><span class="token punctuation">(</span>initialRanks<span class="token punctuation">.</span><span class="token function">map</span><span class="token punctuation">(</span><span class="token parameter">p</span> <span class="token operator">=></span> p<span class="token punctuation">.</span>rank<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token keyword">const</span> finalRanks <span class="token operator">=</span> initialRanks<span class="token punctuation">.</span><span class="token function">map</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token parameter"><span class="token punctuation">{</span> participantId<span class="token punctuation">,</span> rank <span class="token punctuation">}</span></span><span class="token punctuation">)</span> <span class="token operator">=></span> <span class="token punctuation">{</span>
      <span class="token comment">// Don't promote F ranks</span>
      <span class="token keyword">if</span> <span class="token punctuation">(</span>rank <span class="token operator">===</span> <span class="token string">"F"</span><span class="token punctuation">)</span> <span class="token keyword">return</span> <span class="token punctuation">{</span> participantId<span class="token punctuation">,</span> rank <span class="token punctuation">}</span><span class="token punctuation">;</span>
</code></pre>
<p>This final version handles our edge cases much better. It ensures that:</p>
<ol>
<li>
<p>Top performers (75%+ votes) always get rank A</p>
</li>
<li>
<p>Nobody gets stuck in a lower rank when there are empty ranks above them</p>
</li>
<li>
<p>The F rank is reserved for those with zero votes</p>
</li>
<li>
<p>The distribution feels fair regardless of the number of participants</p>
</li>
</ol>
<p>This distribution created a perfect pyramid shape while maintaining the dramatic tension that made the original K-drama so interesting. It’s fascinating how something that seemed so simple at first required so much iteration to get right. But hey, isn’t that just software development in a nutshell?</p>
<p><img src="https://c.tenor.com/kCcWuL40CzkAAAAd/tenor.gif" alt="Pyramid Game"></p>
<h2 id="wrapping-up">Wrapping Up</h2>
<p>Building the Pyramid Game has been a wild ride - from late-night coding sessions fueled by ramyeon to the satisfaction of seeing people actually using it. It’s amazing how a simple K-drama concept turned into a full-fledged web application that people can use to create their own social experiments (hopefully with less drama than the show).</p>
<p>What started as a “hey, I could build that!” moment turned into a deep dive into real-time systems, social dynamics, and the occasional existential crisis about ranking algorithms. The best part? Every time I watch a new episode, I get ideas for new features. My Notion is full of “wouldn’t it be cool if…” notes that I’m slowly turning into reality.</p>
<p>If you want to check out the game or maybe host your own social experiment, you can find it at <a href="https://pyramidgame.errhythm.me">https://pyramidgame.errhythm.me</a>. Just remember: with great power comes great responsibility… and potentially some awkward social situations. 😉</p>
