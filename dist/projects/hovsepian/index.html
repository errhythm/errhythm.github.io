</a> </div> </header> <!-- Featured Image --> <div style="margin-bottom: 50px;" data-astro-cid-ovxcmftc> <img src="https://cdn.errhythm.me/projects/Hovsepian.png" alt="Berj &#38; Emilia Hovsepian: A Custom Wedding Website Design" style="width: 100%; height: auto; border-radius: var(--border-radius);" data-astro-cid-ovxcmftc> </div> <!-- Content --> <div class="project-content" style="max-width: 800px;" data-astro-cid-ovxcmftc> <p>Berj Hovsepian wanted a wedding website that captured the elegance of a traditional wedding card, where guests could easily find event details and RSVP. The site was custom-built using WordPress and Elementor’s Hello theme, focusing on creating a minimalist, card-like design. The website also needed to be fully responsive and user-friendly across all devices, reflecting the couple’s personal style while providing essential wedding information.</p>
<p><img src="https://cdn.errhythm.me/projects/Hovsepian1.png" alt="Main page"></p>
<h3 id="challenge-wedding-card-like-design">Challenge: Wedding Card-Like Design</h3>
<p>The first challenge was to translate the elegance of a physical wedding card into a digital format. Using Elementor, I crafted a clean and classic design with smooth transitions and subtle animations to replicate the feeling of a traditional wedding invitation. The layout was minimal and visually appealing, keeping the focus on the couple’s love story and wedding details.</p>
<h3 id="challenge-responsiveness-across-devices">Challenge: Responsiveness Across Devices</h3>
<p>Ensuring the site was fully responsive on all devices was a critical challenge. Since guests would be accessing the site from various devices, the design needed to maintain its elegance and functionality across desktops, tablets, and smartphones. By utilizing Elementor’s Hello theme and custom CSS, I ensured that every element scaled properly and maintained the visual integrity of the design.</p>
<p><img src="https://cdn.errhythm.me/projects/Hovsepian2.png" alt="Responsive Design of the website"></p>
<h3 id="challenge-creating-the-rsvp-form">Challenge: Creating the RSVP Form</h3>
<p>One of the most complex features was designing a custom RSVP form with specific functionality. The form needed to allow guests to RSVP for up to 5 people and specify their meal preferences—vegan or meat—for snacks. I integrated conditional logic into the form, ensuring guests could add up to 5 additional attendees and select their meal preferences seamlessly. This was a crucial feature to ensure that the wedding organizers could track guest preferences efficiently.</p>
<p>The wedding website for Berj and Emilia Hovsepian beautifully combined elegance with functionality. The project overcame technical challenges such as maintaining a card-like design across devices and creating a custom RSVP form with specific meal options and attendee limits. Built on WordPress with Elementor, the final product provided an engaging and user-friendly experience for wedding guests, while perfectly capturing the couple’s personal style.</p> </div> <!-- Testimonial --> <div style="margin-top: 60px; padding: 30px; background-color: var(--light-navy); border-left: 3px solid var(--green); border-radius: var(--border-radius);" data-astro-cid-ovxcmftc> <h3 style="color: var(--lightest-slate); margin-bottom: 20px;" data-astro-cid-ovxcmftc>Testimonial</h3> <div style="display: flex; gap: 15px; margin-bottom: 15px;" data-astro-cid-ovxcmftc> <img src="https://api.dicebear.com/9.x/initials/png?seed=Berj+Hovsepian" alt="Berj Hovsepian" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover;" data-astro-cid-ovxcmftc> <div data-astro-cid-ovxcmftc> <p style="color: var(--lightest-slate); font-weight: 600; margin-bottom: 5px;" data-astro-cid-ovxcmftc> Berj Hovsepian </p> <p style="color: var(--slate); font-size: var(--fz-sm);" data-astro-cid-ovxcmftc> Subsonic ljudteknik AB </p> <div style="color: var(--green); margin-top: 5px;" data-astro-cid-ovxcmftc> ★★★★★  </div> </div> </div> <p style="color: var(--slate); font-style: italic; line-height: 1.6;" data-astro-cid-ovxcmftc>
