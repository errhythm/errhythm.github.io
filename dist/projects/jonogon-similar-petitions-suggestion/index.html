</a> </div> </header> <!-- Featured Image -->  <!-- Content --> <div class="project-content" style="max-width: 800px;" data-astro-cid-ovxcmftc> <p>Imagine pouring your heart into drafting a petition for your country, only to find that someone else has already raised the same issue. It was clear: duplicate petitions in Jonogon could dilute the collective impact. So I started thinking of a solution which would warn users that same kind of petition already exists so they can check that out first and match their voice with them instead.</p>
<p>One day, while googling something random, it hit me: Google’s search suggestions were the perfect inspiration.I didn’t need to build a full-on, AI-powered search beast for Jonogon—just a simple, friendly feature that suggests similar petitions, it would be like a friendly neighborhood guide, gently tapping you on the shoulder mid-petition-drafting to say, “Hey, someone’s already singing your tune—wanna join the chorus?”</p>
<h2 id="the-quota-chaos-and-a-call-to-unite">The Quota Chaos and a Call to Unite</h2>
<p>Fueled by the spirit of a student-led revolution—the Quota movement in Bangladesh. In the wake of that transformative energy, Jonogon was born: an open-source platform where every verified voice matters, and communities come together to hold decision-makers accountable. With over 2,500 global contributors and a vision of an equitable, compassionate Bangladesh, Jonogon isn’t just a tech project—it’s a movement.</p>
<h2 id="the-big-idea-less-noise-more-power">The Big Idea: Less Noise, More Power</h2>
<p>The goal? Cut the clutter and amplify impact. When you’re typing your petition title, this feature whispers, “Hold up—check these out first.” Like I said previously, when you are typing like Bangladesh should enable cryptocurrency and there is already an existing petition titled, Legalize Paypal and Cryptocurrency in Bangladesh, we are suggesting up to three matching petitions—complete with titles, upvote/downvote counts, and a peek option—we’re helping users decide: join forces or forge ahead solo. It’s all about channeling that collective roar into a single, mighty bellow.</p>
<p><img src="https://cdn.errhythm.me/blog/jonogon-suggestions.gif" alt="Similar Petitions Suggestions"></p>
<h2 id="under-the-hood-the-evolution-of-the-feature">Under the Hood: The Evolution of the Feature</h2>
<p>The backend was the heart of this innovation. I started by crafting a new procedure within our tRPC router.</p>
<p>Suppose, you type a title (five characters minimum—no skimping!), we chop it into keywords, toss out anything under three letters, and ping our PostgreSQL database with ILIKE for a fuzzy match. Five petitions pop up, tops. But the early searches were a keyword free-for-all—“the,” “is,” “and” clogging the pipes. I roped in the <code>stopword</code> library, kicking out English and Bengali fillers (think “the” and “এবং”). Now, we’re laser-focused on the meaty bits.</p>
<p>Using our PostgreSQL query builder, I constructed a dynamic search. The query checks each petition title for a case-insensitive match against our curated keywords. Keywords need at least two hits now, and we sort by match count, upvotes, then downvotes. Only the top five make the cut—quality over quantity, folks!</p>

<p>In the frontend, I slotted right under the title field in our draft and create new petition pages—always watching, ready to pounce. To ensure the interface remained snappy and to avoid bombarding our servers with requests, I used <code>Lodash</code>’s debounce function. This way, the system waits a brief 300 milliseconds after typing stops before initiating the search. A slight delay, but one that ensured a smoother user experience.</p>
<p>Next up? Maybe some <code>pg_trgm</code> wizardry or NLP vibes for a more personalized suggestions. For now, it’s a win for the 2,500+ dreamers building this with me. Check out the official GitHub Repository of <a href="https://github.com/jonogon/jonogon-mono">Jonogon</a>, or vote in <a href="https://jonogon.org/">Jonogon</a>. Let’s keep making Bangladesh louder, together!</p> </div> <!-- Testimonial -->  </article> </main> </template><!--astro:end--></astro-island>   </div> </div> <script type="module">const o=document.getElementById("cursor-spotlight");o&&document.addEventListener("mousemove",e=>{const t=e.clientX,s=e.clientY;o.style.background=`radial-gradient(
